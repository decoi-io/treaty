name: Release Treaty

# Trigger only on release branches
on:
  push:
    branches:
      - "release/**"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Install dependencies
      - name: Install dependencies
        run: bun install

      # 4. Determine bump type from branch name
      - name: Determine bump type
        id: bump
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Release branch: $BRANCH"
          if [[ "$BRANCH" =~ release/patch/ ]]; then
            echo "BUMP=patch" >> $GITHUB_ENV
          elif [[ "$BRANCH" =~ release/minor/ ]]; then
            echo "BUMP=minor" >> $GITHUB_ENV
          elif [[ "$BRANCH" =~ release/major/ ]]; then
            echo "BUMP=major" >> $GITHUB_ENV
          else
            echo "Invalid release branch name. Must be release/patch|minor|major/... "
            exit 1
          fi

      # 5. Determine next version
      - name: Determine next version
        id: version
        run: |
          current=$(git tag --sort=-v:refname | head -n1 || echo "v0.0.0")
          echo "Current version: $current"
          current=${current#v}
          IFS='.' read -r major minor patch <<< "$current"

          if [[ "$BUMP" == "patch" ]]; then
            patch=$((patch+1))
          elif [[ "$BUMP" == "minor" ]]; then
            minor=$((minor+1))
            patch=0
          elif [[ "$BUMP" == "major" ]]; then
            major=$((major+1))
            minor=0
            patch=0
          fi

          NEW_VERSION="$major.$minor.$patch"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Next version: $NEW_VERSION"

      # 6. Update package.json version
      - name: Update package.json version
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          pkg.version = process.env.NEW_VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      # 7. Commit version bump to release branch
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

      # 8. Build the project
      - name: Build
        run: bun tsc

      # 9. Create Git tag for the release
      - name: Tag release
        run: |
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      # 10. Publish to npm
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
