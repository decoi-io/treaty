name: Release

on:
  push:
    branches:
      - "release/patch/**"
      - "release/minor/**"
      - "release/major/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Extract bump type from branch
        id: bump-type
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Full branch name: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" =~ ^release/patch/.+ ]]; then
            BUMP_TYPE="patch"
          elif [[ "$BRANCH_NAME" =~ ^release/minor/.+ ]]; then
            BUMP_TYPE="minor"
          elif [[ "$BRANCH_NAME" =~ ^release/major/.+ ]]; then
            BUMP_TYPE="major"
          else
            echo "❌ Invalid branch name format!"
            echo "Expected: release/{patch|minor|major}/feature-name"
            echo "Got: $BRANCH_NAME"
            exit 1
          fi

          echo "bump-type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "✅ Detected bump type: $BUMP_TYPE"

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js (for version bumping)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Test (placeholder)
        run: |
          echo "🧪 Running tests..."
          echo "✅ Tests would run here"
          # Add your actual test command here when ready
          # bun test

      - name: Get current version for reference
        id: current-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Current version: $VERSION"

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version and create tag
        id: bump-version
        run: |
          echo "⬆️ Bumping version with type: ${{ steps.bump-type.outputs.bump-type }}"
          npm version ${{ steps.bump-type.outputs.bump-type }}
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version bumped to: $NEW_VERSION and tag created"

      - name: Push changes and tags
        run: |
          git push origin ${GITHUB_REF#refs/heads/}
          git push origin --tags
          echo "✅ Version bump and tags pushed successfully"

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          echo "📦 Publishing to npm..."
          npm publish
          echo "✅ Successfully published to npm!"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release summary
        run: |
          echo "## ✅ Release Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${GITHUB_REF#refs/heads/}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Bump type:** \`${{ steps.bump-type.outputs.bump-type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Previous version:** \`${{ steps.current-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**New version:** \`${{ steps.bump-version.outputs.new-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag created:** \`v${{ steps.bump-version.outputs.new-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Published to npm:** ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Check npm: https://www.npmjs.com/package/$(node -p 'require(\"./package.json\").name')" >> $GITHUB_STEP_SUMMARY
          echo "- Merge this branch to main if needed" >> $GITHUB_STEP_SUMMARY
