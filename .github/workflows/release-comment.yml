name: Handle Release Comments

on:
  issue_comment:
    types: [created]

jobs:
  handle-release-comment:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/release') && contains(github.event.issue.labels.*.name, 'release')
    steps:
      - name: Check if commenter has permission
        uses: actions/github-script@v7
        with:
          script: |
            const { data: collaborator } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });

            if (!['admin', 'write'].includes(collaborator.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ @${context.actor} does not have permission to trigger releases. Only users with write or admin access can trigger releases.`
              });
              throw new Error(`User ${context.actor} does not have permission to trigger releases`);
            }

      - name: Parse and validate bump type
        id: parse-bump
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body;
            const match = comment.match(/\/release\s+(patch|minor|major)/);

            if (!match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ Invalid release command. Please use one of:
                - \`/release patch\`
                - \`/release minor\`
                - \`/release major\``
              });
              throw new Error('Invalid release command');
            }

            const bumpType = match[1];
            console.log(`Parsed bump type: ${bumpType}`);
            core.setOutput('bump-type', bumpType);

            // Add reaction to show command was recognized
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Get release branch from issue
        id: get-branch
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const branchMatch = issue.body.match(/\*\*Branch:\*\* `([^`]+)`/);

            if (!branchMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ Could not extract branch information from issue. Please check the issue format.`
              });
              throw new Error('Could not extract branch from issue');
            }

            const branch = branchMatch[1];
            console.log(`Found branch: ${branch}`);
            core.setOutput('branch', branch);

      - name: Add processing comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `🚀 **Starting release process...**
              
            - **Bump type:** \`${{ steps.parse-bump.outputs.bump-type }}\`
            - **Branch:** \`${{ steps.get-branch.outputs.branch }}\`
            - **Triggered by:** @${{ github.actor }}

            The release workflow is now running. You can track progress in the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions).`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.get-branch.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Test (placeholder)
        run: |
          echo "🧪 Running tests..."
          echo "✅ Tests would run here"
          # Add your actual test command here when ready
          # bun test

      - name: Get current version for tagging
        id: current-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version for tagging: $VERSION"

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create tag from current version
        run: |
          TAG="v${{ steps.current-version.outputs.version }}"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Bump version
        id: bump-version
        run: |
          echo "Bumping version with type: ${{ steps.parse-bump.outputs.bump-type }}"
          bun version --${{ steps.parse-bump.outputs.bump-type }}
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump-version.outputs.new-version }}"
          git push origin ${{ steps.get-branch.outputs.branch }}

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update issue with success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `✅ **Release completed successfully!**
              
            - **Tag created:** \`v${{ steps.current-version.outputs.version }}\`
            - **New version:** \`${{ steps.bump-version.outputs.new-version }}\`
            - **Published to npm:** ✅
            - **Branch:** \`${{ steps.get-branch.outputs.branch }}\`

            The package has been published to npm with version \`${{ steps.bump-version.outputs.new-version }}\`.`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              labels: ['release', 'completed']
            });

      - name: Handle errors
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `❌ **Release failed!**
              
            The release process encountered an error. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            You can try again by commenting with the release command once the issue is resolved.`
            });
